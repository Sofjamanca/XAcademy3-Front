<div class="perfil-layout">

  <main class="main-content">
    <div *ngIf="loading" class="loading-container">
      <mat-spinner></mat-spinner>
      <p>Cargando perfil...</p>
    </div>

    <div *ngIf="error && !loading" class="error-container">
      <mat-icon color="warn">error</mat-icon>
      <p>{{ error }}</p>
      <button mat-raised-button color="primary" routerLink="/courses">Volver a cursos</button>
    </div>

    <div *ngIf="teacher && !loading" class="profile-content">


      <mat-card class="info-card">
        <mat-card-header>
          <div mat-card-avatar class="profile-avatar">
            <mat-icon>person</mat-icon>
          </div>
          <mat-card-title *ngIf="teacher.user?.name">{{ teacher.user.name }} {{ teacher.user.lastname }}</mat-card-title>
          <mat-card-subtitle>{{ teacher.specialty || 'Profesor' }}</mat-card-subtitle>
        </mat-card-header>
      </mat-card>

      <section class="courses-section">
        <h3>Mis Cursos</h3>
        
        <div *ngIf="courses.length === 0" class="no-content">
          <p>No tienes cursos asignados todavía.</p>
          
        </div>
        
        <div *ngIf="courses.length > 0" class="courses-grid">
          <app-card *ngFor="let course of courses"
            [title]="course.title || ''"
            [description]="course.description || ''"
            [category]="getCategoryTitle(course.category_id)"
            [image]="course.image_url || ''"
            [action]="'Administrar curso'"
            [showDetails]="true"
            [price]="course.price ? course.price.toString() : ''"
            [quota]="course.quota || null"
            [showFavoriteIcon]="false"
            (actionClick)="course.id ? editCourse(course.id) : null">
          </app-card>
        </div>
      </section>
    </div>
  </main>
</div>
