<div class="container">
  <div class="header-actions">
    <h2>Lista de Profesores</h2>
    <button
      mat-raised-button
      color="primary"
      class="create-teacher-button"
      [routerLink]="['/admin/profesores/new']"
    >
      <mat-icon>add</mat-icon> Nuevo Profesor
    </button>
  </div>

  <!-- Skeleton container -->
  <ng-container *ngIf="loading; else teachersContent">
    <div class="skeleton">
      <div *ngFor="let i of [1, 2, 3]" class="skeleton-row">
        <ngx-skeleton-loader
          appearance="line"
          [theme]="{ height: '18px' }"
        ></ngx-skeleton-loader>
      </div>
    </div>
  </ng-container>

  <!-- Contenido real -->
  <ng-template #teachersContent>
    <div *ngIf="teachers.length === 0" class="no-teachers">
      <mat-icon>school</mat-icon>
      <p>No hay profesores disponibles</p>
      <button
        mat-raised-button
        color="primary"
        class="create-teacher-button"
        [routerLink]="['/admin/profesores/new']"
      >
        <mat-icon>add</mat-icon> Agregar primer profesor
      </button>
    </div>
    <div class="mat-elevation-z8" *ngIf="teachers.length > 0">
      <mat-table mat-table [dataSource]="teachers" class="full-width-table">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <mat-header-cell mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
          <mat-cell mat-cell *matCellDef="let teacher">{{ teacher.id }}</mat-cell>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <mat-header-cell mat-header-cell *matHeaderCellDef>Nombre</mat-header-cell>
          <mat-cell mat-cell *matCellDef="let teacher">
            {{ teacher.user.name }} {{ teacher.user.lastname }}
          </mat-cell>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <mat-header-cell mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
          <mat-cell mat-cell *matCellDef="let teacher">{{ teacher.user.email }}</mat-cell>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <mat-header-cell mat-header-cell *matHeaderCellDef>Acciones</mat-header-cell>
          <mat-cell mat-cell *matCellDef="let teacher">
            <button
              mat-icon-button
              color="primary"
              [routerLink]="['/admin/profesores/view/', teacher.id]"
              aria-label="Ver detalles del profesor"
              matTooltip="Ver detalles"
            >
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              mat-icon-button
              color="primary"
              (click)="editTeacher(teacher)"
              aria-label="Editar profesor"
              matTooltip="Editar profesor"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
      </mat-table>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        aria-label="Seleccionar página de profesores"
      ></mat-paginator>
    </div>
  </ng-template>
</div>
