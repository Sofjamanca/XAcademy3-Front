<div class="articles-container">
  <div class="header">
    <h1>Gestión de Artículos</h1>
    <button mat-raised-button color="primary" (click)="createArticle()">
      <mat-icon>add</mat-icon>
      Nuevo Artículo
    </button>
  </div>

  <!-- Skeleton loader -->
  <ng-container *ngIf="isLoading">
    <div class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
      <p class="loading-text">Cargando artículos...</p>
    </div>
  </ng-container>

  <!-- Contenido real -->
  <ng-container *ngIf="!isLoading">
    <!-- Sin artículos -->
    <div *ngIf="dataSource.data.length === 0" class="empty-state">
      <mat-icon>article</mat-icon>
      <p>No hay artículos disponibles</p>
      <button mat-raised-button color="primary" (click)="createArticle()">
        <mat-icon>add</mat-icon> Agregar primer artículo
      </button>
    </div>

    <!-- Tabla de artículos -->
    <div class="table-container" *ngIf="dataSource.data.length > 0">
      <table mat-table [dataSource]="dataSource" class="full-width-table">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let article">{{article.id}}</td>
        </ng-container>

        <!-- Title Column -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Título</th>
          <td mat-cell *matCellDef="let article">
            <span [matTooltip]="article.title" class="ellipsis-text">{{article.title}}</span>
          </td>
        </ng-container>

        <!-- Created Date Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let article">{{formatDate(article.createdAt)}}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let article" class="actions-cell">
            <div class="actions-container-cell">
              <button mat-icon-button color="primary" (click)="viewArticle(article)" matTooltip="Ver">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button color="primary" (click)="editArticle(article)" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
             
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </ng-container>
</div>
