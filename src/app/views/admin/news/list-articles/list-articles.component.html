<div class="articles-container">
  <div class="header">
    <h1>Gestión de Artículos</h1>
    <button mat-raised-button color="primary" (click)="createArticle()">
      <mat-icon>add</mat-icon>
      Nuevo Artículo
    </button>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p class="loading-text">Cargando artículos...</p>
  </div>

  <div *ngIf="!isLoading && dataSource.data.length === 0" class="empty-state">
    <mat-icon>article</mat-icon>
    <p>No hay artículos disponibles</p>
    <button mat-raised-button color="primary" (click)="createArticle()">
      Crear primer artículo
    </button>
  </div>

  <div *ngIf="!isLoading && dataSource.data.length > 0" class="table-container">
    <table mat-table [dataSource]="dataSource" class="full-width-table">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let article">{{article.id}}</td>
      </ng-container>

      <!-- Title Column -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let article">{{article.title}}</td>
      </ng-container>

      <!-- Created Date Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Fecha de Creación</th>
        <td mat-cell *matCellDef="let article">{{formatDate(article.createdAt)}}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let article">
          <button mat-icon-button color="primary" (click)="viewArticle(article)" matTooltip="Ver artículo">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="editArticle(article)" matTooltip="Editar artículo">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteArticle(article)" matTooltip="Eliminar artículo">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons 
                *ngIf="!isLoading && dataSource.data.length > 0"></mat-paginator>
</div>
