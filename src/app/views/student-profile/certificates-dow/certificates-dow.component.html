<div *ngIf="loading" class="loading-spinner">
  <mat-spinner diameter="50"></mat-spinner>
  <p>Procesando certificado...</p>
</div>

<div class="certificates-container">
  <h1>🎓 Mis Certificados</h1>

  <div class="certificates-container">
    <h1>🎓 Mis Certificados</h1>
  
    <div *ngIf="loading" class="loading-spinner">
      <!-- Tu spinner de carga -->
    </div>
  
    <div *ngIf="certificados.length > 0; else noCertificates">
      <div *ngFor="let cert of certificados" class="certificate-card">
        <div class="certificate-header">
          <h2>{{ cert.course_title || 'Curso' }}</h2>
          <span>📅 {{ cert.issue_date | date:'dd/MM/yyyy' }}</span>
        </div>
        
        <div class="certificate-footer">
          <button 
            (click)="handleCertificateAction(cert.student_id, cert.course_id)" 
            class="btn"
            [disabled]="loading">
            {{ cert.file_path ? 'Descargar Certificado' : 'Generar Certificado' }}
          </button>
        </div>
      </div>
    </div>
  
    <ng-template #noCertificates>
      <div class="no-certificates">
        <p>No tienes certificados disponibles aún.</p>
        <!-- Opcional: Botón para generar certificados si cumple requisitos -->
        <button 
          *ngIf="studentId"
          (click)="checkAndGenerateCertificates()"
          class="btn-generate">
          Verificar y Generar Certificados
        </button>
      </div>
    </ng-template>
  </div>
