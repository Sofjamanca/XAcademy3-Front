<div class="student-management-container">
  
  <div *ngIf="loadingStudents" class="loading-spinner">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Cargando estudiantes...</p>
  </div>
  
  <div *ngIf="!loadingStudents && students.length === 0" class="no-data-message">
    <mat-icon>people_outline</mat-icon>
    <p>No hay estudiantes inscritos en este curso</p>
  </div>
  
  <table *ngIf="!loadingStudents && students.length > 0" mat-table [dataSource]="students" class="mat-elevation-z4 students-table">
    <!-- Columna de nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let student">{{ student.name }}</td>
    </ng-container>
    
    <!-- Columna de email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let student">{{ student.email }}</td>
    </ng-container>
    
    <!-- Columna de condición -->
    <ng-container matColumnDef="condition">
      <th mat-header-cell *matHeaderCellDef>Condición</th>
      <td mat-cell *matCellDef="let student">
        {{ student.studentCondition || 'Regular' }}
      </td>
    </ng-container>
    
    <!-- Columna de calificación -->
    <ng-container matColumnDef="calification">
      <th mat-header-cell *matHeaderCellDef>Calificación</th>
      <td mat-cell *matCellDef="let student">
        <span *ngIf="student.qualification !== undefined && student.qualification !== null">
          {{ student.qualification }}
        </span>
        <span *ngIf="student.qualification === undefined || student.qualification === null">
          Sin calificar
        </span>
      </td>
    </ng-container>
    
    <!-- Columna de acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let student">
        <button mat-icon-button color="accent"
                matTooltip="Calificar estudiante"
                (click)="gradeStudent(student)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>
    
    <!-- Definición de filas -->
    <tr mat-header-row *matHeaderRowDef="displayedStudentColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedStudentColumns;"></tr>
  </table>
</div>
