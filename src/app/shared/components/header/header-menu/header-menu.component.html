<nav [class.mobile-version]="isMobile" class="menu">
  <ul class="nav-menu">
      <li *ngFor="let item of menuItems" (click)="itemClick.emit()">
          <a [routerLink]="item.route" routerLinkActive="active">
              <mat-icon *ngIf="isMobile">{{item.icon}}</mat-icon>
              <span [class.mobile-version]="isMobile">{{item.text}}</span>
          </a>
      </li>
  </ul>
</nav>
