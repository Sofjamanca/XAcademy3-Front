<div class="edit-profile-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Editar Perfil</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div class="user-name">
          <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" type="text" class="flex-input">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Apellido</mat-label>
            <input matInput formControlName="lastname" type="text" class="flex-input">
          </mat-form-field>
        </div>

        <div class="personal-info">
          <mat-form-field appearance="outline">
            <mat-label>DNI</mat-label>
            <input matInput formControlName="dni" type="number" class="flex-input">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Fecha de Nacimiento</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="birthday">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="contact">
          <mat-form-field appearance="outline">
            <mat-label>Teléfono</mat-label>
            <input matInput formControlName="phone" type="text" class="flex-input">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Dirección</mat-label>
            <input matInput formControlName="address">
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="goBack()">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="profileForm.invalid">
            Guardar Cambios
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
